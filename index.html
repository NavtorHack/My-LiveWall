<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My LiveWall v2.9</title>
    <link rel="shortcut icon" href="images/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .video-container video,
        .video-container img {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
        }

        .video-container.fading video,
        .video-container.fading img {
            opacity: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
            transition: background 1.5s ease;
        }

        .overlay.night {
            background: rgba(0, 0, 0, 0.55);
        }

        .clock-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .time-wrapper {
            position: relative;
            display: inline-block;
        }

        #digitalClock {
            font-size: clamp(5rem, 14vw, 10rem);
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.9),
                0 0 40px rgba(100, 180, 255, 0.6),
                0 0 80px rgba(50, 150, 255, 0.4),
                0 0 120px rgba(0, 100, 255, 0.3);
            line-height: 0.85;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif;
            font-stretch: ultra-condensed;
            letter-spacing: 2px;
            transform: scaleY(1.5);
            display: inline-block;
            margin: 0.5rem 0;
            padding-top: 0.15em;
        }

        .seconds-display {
            position: absolute;
            top: -0.3em;
            right: -0.5em;
            font-size: clamp(1rem, 3vw, 1.8rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.6),
                0 0 20px rgba(100, 180, 255, 0.4);
            font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif;
            letter-spacing: 1px;
            transform: none;
            line-height: 1;
        }

        .day-label {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 
                0 0 15px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 45px rgba(100, 180, 255, 0.3);
            text-transform: uppercase;
            font-family: 'SF Pro Display', 'Helvetica Neue', 'Arial', sans-serif;
            font-stretch: ultra-condensed;
            transform: scaleY(1.3);
            width: 100%;
            display: block;
            text-align: center;
            line-height: 0.9;
            padding-top: 0.1em;
            margin-top: 0.5rem;
        }

        .date-label {
            font-size: clamp(1.2rem, 3.5vw, 2rem);
            font-weight: 300;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 
                0 0 15px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            width: 100%;
            display: block;
            text-align: center;
        }

        .credits {
            position: fixed;
            bottom: clamp(15px, 3vh, 25px);
            left: clamp(15px, 3vw, 25px);
            z-index: 15;
            pointer-events: none;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .app-name {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1.5px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .app-version {
            font-size: clamp(0.55rem, 0.9vw, 0.65rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.45);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .powered-by {
            font-size: clamp(0.6rem, 1.2vw, 0.75rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .night-indicator {
            position: fixed;
            top: clamp(10px, 2vh, 15px);
            right: clamp(10px, 2vw, 15px);
            z-index: 15;
            pointer-events: none;
            font-size: clamp(0.7rem, 1.2vw, 0.8rem);
            color: rgba(255, 255, 255, 0.25);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 1.5s ease;
            letter-spacing: 1px;
        }

        .night-indicator.visible {
            opacity: 0.6;
        }

        .music-indicator {
            position: fixed;
            top: clamp(30px, 5vh, 45px);
            right: clamp(10px, 2vw, 15px);
            z-index: 15;
            pointer-events: none;
            font-size: clamp(0.7rem, 1.2vw, 0.8rem);
            color: rgba(255, 255, 255, 0.25);
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.8s ease;
            letter-spacing: 1px;
        }

        .music-indicator.visible {
            opacity: 0.6;
        }

        .settings-btn {
            position: fixed;
            bottom: clamp(20px, 4vh, 30px);
            right: clamp(20px, 4vw, 30px);
            z-index: 100;
            width: auto;
            height: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: clamp(28px, 5vw, 36px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            padding: 5px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }

        .settings-btn:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: scale(1.1) rotate(30deg);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .settings-btn:active {
            transform: scale(0.9) rotate(30deg);
            transition: all 0.1s ease;
        }

        .settings-panel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 99;
            background: rgba(20, 25, 40, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 1rem 1.5rem 1.5rem 1.5rem;
            min-width: clamp(280px, 80vw, 320px);
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transform: translateY(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
        }

        .settings-panel.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .panel-header {
            text-align: left;
            margin-bottom: 1rem;
            padding-top: 0;
        }

        .panel-header h3 {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            color: #b8d4ff;
            letter-spacing: 1px;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-header .header-icon {
            font-size: 1.3rem;
        }

        .setting-group {
            margin-bottom: 0.8rem;
        }

        .setting-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 500;
        }

        .setting-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
        }

        .setting-group select:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .setting-group select option {
            background: #1a1a2e;
            color: white;
            padding: 0.5rem;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 1rem 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #8ac4ff;
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .sub-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
            padding-left: 1.8rem;
        }

        .sub-group label {
            font-size: 0.8rem;
            color: #999;
            margin: 0;
        }

        .sub-group select {
            width: auto;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            outline: none;
        }

        .sub-group select option {
            background: #1a1a2e;
            color: white;
        }

        .sub-group input[type="range"] {
            width: 80px;
            cursor: pointer;
            accent-color: #8ac4ff;
        }

        .file-input-hidden {
            display: none;
        }

        .custom-file-name {
            font-size: 0.8rem;
            color: #8ac4ff;
            margin-top: 0.3rem;
            word-break: break-all;
            display: none;
        }

        .custom-file-name.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .settings-panel::-webkit-scrollbar {
            width: 5px;
        }

        .settings-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .settings-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .settings-panel::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .settings-panel {
                bottom: 90px;
                right: 20px;
                left: 20px;
                min-width: auto;
                width: auto;
                max-height: 60vh;
            }
            .settings-btn {
                bottom: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .settings-panel {
                bottom: 80px;
                right: 15px;
                left: 15px;
                padding: 0.8rem 1.2rem 1.2rem 1.2rem;
                max-height: 55vh;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            animation: fadeIn 0.8s ease-in;
        }

        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            color: white;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>

    <script>
        (function() {
            // ============ ELEMENTOS DEL DOM ============
            const wallpaperContainer = document.getElementById('wallpaperContainer');
            const videoElement = document.getElementById('wallpaperVideo');
            const overlay = document.getElementById('overlay');
            const dayDisplay = document.getElementById('dayDisplay');
            const clockElement = document.getElementById('digitalClock');
            const secondsDisplay = document.getElementById('secondsDisplay');
            const dateDisplay = document.getElementById('dateDisplay');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsPanel = document.getElementById('settingsPanel');
            const wallpaperSelect = document.getElementById('wallpaperSelect');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const customFileInput = document.getElementById('customFileInput');
            const customFileName = document.getElementById('customFileName');
            const randomModeCheckbox = document.getElementById('randomModeCheckbox');
            const randomIntervalGroup = document.getElementById('randomIntervalGroup');
            const randomIntervalSelect = document.getElementById('randomIntervalSelect');
            const nightIndicator = document.getElementById('nightIndicator');
            const musicIndicator = document.getElementById('musicIndicator');
            
            const musicSelect = document.getElementById('musicSelect');
            const customAudioInput = document.getElementById('customAudioInput');
            const customMusicFileName = document.getElementById('customMusicFileName');
            const musicVolumeGroup = document.getElementById('musicVolumeGroup');
            const musicVolumeSlider = document.getElementById('musicVolumeSlider');
            const musicVolumeLabel = document.getElementById('musicVolumeLabel');
            const musicRandomCheckbox = document.getElementById('musicRandomCheckbox');

            // ============ CONSTANTES ============
            const STORAGE_KEY = 'mylivewall_config';
            const PRESET_WALLPAPERS = Array.from({ length: 20 }, (_, i) => `Live Wallpaper ${i + 1}`);
            const PRESET_MUSIC = [
                "Skywalk - Synthwave Mix",
                "Edelyn - Synthwave Mix",
                "Rising From Silence - Synthwave Mix",
                "Shining Bright - Synthwave Mix",
                "Graduation Day - Synthwave Mix",
                "Touch The Sky - Synthwave Mix",
                "Cheese Tea - Synthwave Mix",
                "Double Disaster - Synthwave Mix",
                "AnimeporiA - Synthwave Mix",
                "Mercury Mirage - Synthwave Mix",
                "Meteor Dance - Synthwave Mix",
                "Burning Daylight - Synthwave Mix",
                "Predicament - Synthwave Mix",
                "Glorious Moment - Synthwave Mix"
            ];
            const SILENCE_BETWEEN_TRACKS = 5000; // 5 segundos

            // ============ AUDIO ============
            const bgMusic = new Audio();
            bgMusic.loop = false; // No usar loop nativo, controlamos manualmente
            bgMusic.volume = 0.5;
            let currentMusic = 'none';
            let customMusicURL = null;
            let isMusicRandom = false;
            let isUpdatingMusicSelect = false;
            let musicEndedHandler = null;

            // ============ MODO NOCHE ============
            let lastNightCheck = 0;
            
            function updateNightMode() {
                const now = Date.now();
                if (now - lastNightCheck < 60000) return;
                lastNightCheck = now;
                
                const currentHour = new Date().getHours();
                const isNight = currentHour >= 18 || currentHour < 6;
                
                if (isNight) {
                    overlay.classList.add('night');
                    nightIndicator.classList.add('visible');
                } else {
                    overlay.classList.remove('night');
                    nightIndicator.classList.remove('visible');
                }
            }

            // ============ RELOJ DIGITAL ============
            function updateClock() {
                const now = new Date();
                
                clockElement.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                secondsDisplay.textContent = String(now.getSeconds()).padStart(2, '0');
                
                const days = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
                dayDisplay.textContent = days[now.getDay()];
                
                const months = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 
                              'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
                dateDisplay.textContent = `${now.getDate()} DE ${months[now.getMonth()]} DE ${now.getFullYear()}`;
                
                updateNightMode();
            }

            updateClock();
            setInterval(updateClock, 1000);

            // ============ GESTIÓN DE MÚSICA ============
            function updateMusicIndicator() {
                if (currentMusic !== 'none' && !bgMusic.paused) {
                    musicIndicator.classList.add('visible');
                } else {
                    musicIndicator.classList.remove('visible');
                }
            }

            function playMusic() {
                bgMusic.play().catch(() => {});
                updateMusicIndicator();
            }

            function stopMusic() {
                bgMusic.pause();
                bgMusic.currentTime = 0;
                removeMusicEndedHandler();
                updateMusicIndicator();
            }

            function removeMusicEndedHandler() {
                if (musicEndedHandler) {
                    bgMusic.removeEventListener('ended', musicEndedHandler);
                    musicEndedHandler = null;
                }
            }

            function setupMusicEndedHandler() {
                removeMusicEndedHandler();
                
                musicEndedHandler = function() {
                    updateMusicIndicator(); // Ocultar indicador durante silencio
                    
                    setTimeout(() => {
                        if (isMusicRandom) {
                            // Modo aleatorio: cambiar a otro tema
                            let newMusic;
                            do {
                                newMusic = PRESET_MUSIC[Math.floor(Math.random() * PRESET_MUSIC.length)];
                            } while (newMusic === currentMusic && PRESET_MUSIC.length > 1);
                            changeMusic(newMusic);
                        } else {
                            // Modo normal: repetir el mismo tema
                            bgMusic.currentTime = 0;
                            playMusic();
                        }
                    }, SILENCE_BETWEEN_TRACKS);
                };
                
                bgMusic.addEventListener('ended', musicEndedHandler);
            }

            function changeMusic(musicName) {
                if (customMusicURL) {
                    URL.revokeObjectURL(customMusicURL);
                    customMusicURL = null;
                }

                if (musicName === 'none') {
                    stopMusic();
                    currentMusic = 'none';
                    musicVolumeGroup.style.display = 'none';
                    updateMusicIndicator();
                } else {
                    const audioPath = `audio/${musicName}.mp3`;
                    bgMusic.src = audioPath;
                    bgMusic.load();
                    bgMusic.volume = musicVolumeSlider.value / 100;
                    musicVolumeGroup.style.display = 'flex';
                    currentMusic = musicName;
                    
                    setupMusicEndedHandler();
                    
                    bgMusic.addEventListener('canplay', function() {
                        playMusic();
                    }, { once: true });
                }
                
                isUpdatingMusicSelect = true;
                musicSelect.value = musicName;
                isUpdatingMusicSelect = false;
                
                saveConfig();
            }

            function loadCustomMusic(file) {
                if (!file.type.startsWith('audio/')) {
                    alert('Formato no soportado. Usa archivos MP3, OGG o WAV.');
                    return;
                }

                if (customMusicURL) URL.revokeObjectURL(customMusicURL);

                customMusicURL = URL.createObjectURL(file);
                bgMusic.src = customMusicURL;
                bgMusic.load();
                bgMusic.volume = musicVolumeSlider.value / 100;
                musicVolumeGroup.style.display = 'flex';
                currentMusic = '__custom_music__';
                
                setupMusicEndedHandler();
                
                customMusicFileName.textContent = '✅ ' + file.name;
                customMusicFileName.classList.add('show');

                bgMusic.addEventListener('canplay', function() {
                    playMusic();
                }, { once: true });

                saveConfig();
            }

            musicSelect.addEventListener('change', (e) => {
                if (isUpdatingMusicSelect) return;
                
                const value = e.target.value;
                
                if (value === '__custom_music__') {
                    isUpdatingMusicSelect = true;
                    musicSelect.value = currentMusic || 'none';
                    isUpdatingMusicSelect = false;
                    customAudioInput.click();
                } else if (value === 'none') {
                    customMusicFileName.classList.remove('show');
                    customMusicFileName.textContent = '';
                    if (isMusicRandom) {
                        musicRandomCheckbox.checked = false;
                        stopMusicRandom();
                    }
                    changeMusic('none');
                } else {
                    customMusicFileName.classList.remove('show');
                    customMusicFileName.textContent = '';
                    changeMusic(value);
                }
            });

            customAudioInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (isMusicRandom) {
                        musicRandomCheckbox.checked = false;
                        stopMusicRandom();
                    }
                    loadCustomMusic(file);
                }
                customAudioInput.value = '';
            });

            musicVolumeSlider.addEventListener('input', () => {
                bgMusic.volume = musicVolumeSlider.value / 100;
                musicVolumeLabel.textContent = musicVolumeSlider.value + '%';
                saveConfig();
            });

            function stopMusicRandom() {
                isMusicRandom = false;
                // El tema actual seguirá reproduciéndose en bucle normal
                console.log('Modo aleatorio musical desactivado');
            }

            function startMusicRandom() {
                isMusicRandom = true;
                console.log('Modo aleatorio musical activado (cambia al terminar cada tema)');
            }

            musicRandomCheckbox.addEventListener('change', () => {
                if (musicRandomCheckbox.checked) {
                    if (currentMusic === 'none') {
                        const randomMusic = PRESET_MUSIC[Math.floor(Math.random() * PRESET_MUSIC.length)];
                        changeMusic(randomMusic);
                    }
                    startMusicRandom();
                } else {
                    stopMusicRandom();
                }
                saveConfig();
            });

            // ============ GESTIÓN DE FONDOS ============
            let currentMedia = 'Live Wallpaper 1';
            let customMediaURL = null;
            let currentMediaType = 'video';
            let imageElement = null;
            let isUpdatingSelect = false;
            let customActiveOption = null;
            let randomTimer = null;
            let isRandomMode = false;
            let randomInterval = 60;
            
            function createImageElement() {
                if (!imageElement) {
                    imageElement = document.createElement('img');
                    imageElement.style.cssText = `
                        position: absolute; top: 50%; left: 50%;
                        min-width: 100%; min-height: 100%;
                        width: auto; height: auto;
                        transform: translate(-50%, -50%);
                        object-fit: cover;
                        transition: opacity 0.8s ease-in-out;
                    `;
                }
                return imageElement;
            }

            function showVideo() {
                videoElement.style.display = '';
                if (imageElement) imageElement.style.display = 'none';
            }

            function showImage() {
                videoElement.style.display = 'none';
                if (imageElement) imageElement.style.display = '';
            }

            function cleanupCustomMedia() {
                if (customMediaURL) { URL.revokeObjectURL(customMediaURL); customMediaURL = null; }
                removeCustomActiveOption();
            }

            function addCustomActiveOption() {
                removeCustomActiveOption();
                customActiveOption = document.createElement('option');
                customActiveOption.value = '__custom_active__';
                customActiveOption.textContent = '📂 Personalizado';
                customActiveOption.classList.add('custom-active-option');
                customActiveOption.disabled = true;
                const customOption = wallpaperSelect.querySelector('option[value="__custom__"]');
                if (customOption) customOption.parentNode.insertBefore(customActiveOption, customOption.nextSibling);
            }

            function removeCustomActiveOption() {
                if (customActiveOption) { customActiveOption.remove(); customActiveOption = null; }
            }

            function showCustomActiveState() {
                addCustomActiveOption();
                isUpdatingSelect = true;
                wallpaperSelect.value = '__custom_active__';
                isUpdatingSelect = false;
            }

            function fadeTransition(callback) {
                wallpaperContainer.classList.add('fading');
                setTimeout(() => {
                    callback();
                    setTimeout(() => wallpaperContainer.classList.remove('fading'), 100);
                }, 400);
            }

            function changeToPresetVideo(videoName, skipTransition = false) {
                const performChange = () => {
                    cleanupCustomMedia();
                    currentMediaType = 'video';
                    showVideo();
                    
                    const videoPath = `videos/${videoName}.webm`;
                    videoElement.pause();
                    const source = videoElement.querySelector('source');
                    source.src = videoPath;
                    source.type = 'video/webm';
                    videoElement.src = videoPath;
                    videoElement.load();
                    
                    videoElement.addEventListener('loadeddata', function() {
                        videoElement.play().then(() => loadingIndicator.style.display = 'none')
                        .catch(() => { loadingIndicator.style.display = 'none'; });
                    }, { once: true });
                    
                    setTimeout(() => { loadingIndicator.style.display = 'none'; }, 3000);
                    
                    currentMedia = videoName;
                    isUpdatingSelect = true;
                    wallpaperSelect.value = videoName;
                    isUpdatingSelect = false;
                    saveConfig();
                };

                if (skipTransition) performChange();
                else {
                    loadingIndicator.style.display = 'flex';
                    fadeTransition(performChange);
                }
            }

            function loadCustomFile(file) {
                loadingIndicator.style.display = 'flex';
                
                const performChange = () => {
                    cleanupCustomMedia();
                    customMediaURL = URL.createObjectURL(file);
                    
                    if (file.type.startsWith('video/')) {
                        currentMediaType = 'video';
                        showVideo();
                        videoElement.pause();
                        const source = videoElement.querySelector('source');
                        source.src = customMediaURL;
                        source.type = file.type;
                        videoElement.src = customMediaURL;
                        videoElement.load();
                        videoElement.addEventListener('loadeddata', function() {
                            videoElement.play().then(() => loadingIndicator.style.display = 'none')
                            .catch(() => loadingIndicator.style.display = 'none');
                        }, { once: true });
                    } else if (file.type.startsWith('image/')) {
                        currentMediaType = 'image';
                        const img = createImageElement();
                        img.src = customMediaURL;
                        img.onload = function() {
                            if (!wallpaperContainer.contains(img)) wallpaperContainer.appendChild(img);
                            showImage();
                            loadingIndicator.style.display = 'none';
                        };
                        img.onerror = function() {
                            alert('Error al cargar la imagen.');
                            loadingIndicator.style.display = 'none';
                            resetToDefault();
                        };
                    } else {
                        alert('Formato no soportado.');
                        loadingIndicator.style.display = 'none';
                        resetToDefault();
                        return;
                    }
                    
                    setTimeout(() => { loadingIndicator.style.display = 'none'; }, 3000);
                    currentMedia = '__custom__';
                    customFileName.textContent = '✅ ' + file.name;
                    customFileName.classList.add('show');
                    showCustomActiveState();
                    saveConfig();
                };

                fadeTransition(performChange);
            }

            function resetToDefault() {
                customFileName.classList.remove('show');
                customFileName.textContent = '';
                changeToPresetVideo('Live Wallpaper 1');
            }

            videoElement.addEventListener('error', function() {
                loadingIndicator.style.display = 'none';
                setTimeout(() => {
                    if (currentMedia === '__custom__' && customMediaURL && currentMediaType === 'video') {
                        videoElement.src = customMediaURL;
                        videoElement.load();
                        videoElement.play().catch(() => {});
                    } else if (currentMediaType === 'video') {
                        videoElement.src = `videos/${currentMedia}.webm`;
                        videoElement.load();
                        videoElement.play().catch(() => {});
                    }
                }, 5000);
            });

            videoElement.addEventListener('ended', function() {
                videoElement.currentTime = 0;
                videoElement.play().catch(() => {});
            });

            function getRandomWallpaper() {
                return PRESET_WALLPAPERS[Math.floor(Math.random() * PRESET_WALLPAPERS.length)];
            }

            function startRandomMode() {
                stopRandomMode();
                randomTimer = setInterval(() => {
                    if (currentMedia === '__custom__') changeToPresetVideo(getRandomWallpaper());
                    else {
                        let newWallpaper;
                        do { newWallpaper = getRandomWallpaper(); }
                        while (newWallpaper === currentMedia && PRESET_WALLPAPERS.length > 1);
                        changeToPresetVideo(newWallpaper);
                    }
                }, randomInterval * 1000);
                isRandomMode = true;
            }

            function stopRandomMode() {
                if (randomTimer) { clearInterval(randomTimer); randomTimer = null; }
                isRandomMode = false;
            }

            // ============ PERSISTENCIA ============
            function saveConfig() {
                const config = {
                    currentMedia, isRandomMode, randomInterval,
                    currentMusic, isMusicRandom,
                    musicVolume: musicVolumeSlider.value
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            }

            function loadConfig() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const config = JSON.parse(saved);
                        
                        if (config.randomInterval) { randomInterval = config.randomInterval; randomIntervalSelect.value = config.randomInterval; }
                        if (config.isRandomMode) { randomModeCheckbox.checked = true; randomIntervalGroup.style.display = 'flex'; isRandomMode = true; }
                        
                        if (config.musicVolume) { musicVolumeSlider.value = config.musicVolume; musicVolumeLabel.textContent = config.musicVolume + '%'; bgMusic.volume = config.musicVolume / 100; }
                        if (config.isMusicRandom) { musicRandomCheckbox.checked = true; isMusicRandom = true; }
                        if (config.currentMusic && config.currentMusic !== 'none') {
                            currentMusic = config.currentMusic;
                            if (currentMusic !== '__custom_music__') {
                                const audioPath = `audio/${currentMusic}.mp3`;
                                bgMusic.src = audioPath;
                                bgMusic.load();
                                musicVolumeGroup.style.display = 'flex';
                                setupMusicEndedHandler();
                                bgMusic.addEventListener('canplay', function() { playMusic(); }, { once: true });
                            }
                        }
                        
                        if (config.currentMedia === '__custom__') return 'Live Wallpaper 1';
                        return config.currentMedia || 'Live Wallpaper 1';
                    }
                } catch (e) { console.log('Error al cargar configuración:', e); }
                return 'Live Wallpaper 1';
            }

            // ============ SELECTOR WALLPAPERS ============
            wallpaperSelect.addEventListener('change', (e) => {
                if (isUpdatingSelect) return;
                const selectedValue = e.target.value;
                
                if (selectedValue === '__custom__') {
                    if (currentMedia === '__custom__') showCustomActiveState();
                    else {
                        isUpdatingSelect = true;
                        wallpaperSelect.value = currentMedia;
                        isUpdatingSelect = false;
                    }
                    customFileInput.click();
                } else {
                    customFileName.classList.remove('show');
                    customFileName.textContent = '';
                    if (isRandomMode) {
                        randomModeCheckbox.checked = false;
                        randomIntervalGroup.style.display = 'none';
                        stopRandomMode();
                        saveConfig();
                    }
                    changeToPresetVideo(selectedValue);
                }
            });

            customFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadCustomFile(file);
                else {
                    if (currentMedia === '__custom__') showCustomActiveState();
                    else { isUpdatingSelect = true; wallpaperSelect.value = currentMedia; isUpdatingSelect = false; }
                }
                customFileInput.value = '';
            });

            randomModeCheckbox.addEventListener('change', () => {
                if (randomModeCheckbox.checked) {
                    randomIntervalGroup.style.display = 'flex';
                    randomInterval = parseInt(randomIntervalSelect.value);
                    startRandomMode();
                } else { randomIntervalGroup.style.display = 'none'; stopRandomMode(); }
                saveConfig();
            });

            randomIntervalSelect.addEventListener('change', () => {
                randomInterval = parseInt(randomIntervalSelect.value);
                if (isRandomMode) startRandomMode();
                saveConfig();
            });

            // ============ PANEL ============
            settingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                settingsPanel.classList.toggle('active');
                if (settingsPanel.classList.contains('active')) {
                    settingsBtn.style.transform = 'rotate(60deg)';
                    settingsBtn.style.color = 'rgba(255, 255, 255, 0.7)';
                    if (currentMedia === '__custom__') showCustomActiveState();
                } else {
                    settingsBtn.style.transform = 'rotate(0deg)';
                    settingsBtn.style.color = 'rgba(255, 255, 255, 0.3)';
                }
            });

            document.addEventListener('click', (e) => {
                if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                    settingsPanel.classList.remove('active');
                    settingsBtn.style.transform = 'rotate(0deg)';
                    settingsBtn.style.color = 'rgba(255, 255, 255, 0.3)';
                }
            });

            settingsPanel.addEventListener('click', (e) => e.stopPropagation());

            // ============ PANTALLA COMPLETA ============
            function isFullscreen() {
                return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            }

            function requestFullscreen() {
                if (isFullscreen()) return;
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            }

            document.addEventListener('click', function fullscreenHandler(e) {
                if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target) || 
                    e.target === customFileInput || e.target === customAudioInput) return;
                requestFullscreen();
            });

            document.addEventListener('touchstart', function fullscreenHandler(e) {
                if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target) || 
                    e.target === customFileInput || e.target === customAudioInput) return;
                requestFullscreen();
            });

            document.addEventListener('touchmove', function(e) {
                if (e.target === videoElement || e.target === imageElement) e.preventDefault();
            }, { passive: false });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (currentMediaType === 'video') videoElement.pause();
                    bgMusic.pause();
                } else {
                    if (currentMediaType === 'video') videoElement.play().catch(() => {});
                    if (currentMusic !== 'none') playMusic();
                }
            });

            // ============ INIT ============
            function init() {
                console.log('Inicializando My LiveWall v2.9...');
                lastNightCheck = 0;
                updateNightMode();
                const savedMedia = loadConfig();
                changeToPresetVideo(savedMedia, true);
                if (isRandomMode) setTimeout(() => startRandomMode(), 1000);
                
                // Si había música configurada, el ended handler ya se configuró en loadConfig
                
                videoElement.play().catch(() => {
                    const playOnInteraction = () => {
                        if (currentMediaType === 'video') videoElement.play().catch(() => {});
                        document.removeEventListener('click', playOnInteraction);
                        document.removeEventListener('touchstart', playOnInteraction);
                    };
                    document.addEventListener('click', playOnInteraction);
                    document.addEventListener('touchstart', playOnInteraction);
                });
            }

            init();

            window.addEventListener('beforeunload', () => {
                videoElement.pause();
                videoElement.src = '';
                videoElement.load();
                cleanupCustomMedia();
                stopRandomMode();
                if (customMusicURL) URL.revokeObjectURL(customMusicURL);
                removeMusicEndedHandler();
                saveConfig();
            });

            console.log('✅ My LiveWall v2.9 cargado correctamente');
            console.log('🌙 Modo noche automático (18:00 - 6:00)');
            console.log('🎵 14 temas Synthwave Mix');
            console.log('⏱️ 5 segundos de silencio entre temas');
            console.log('📁 Videos en: /videos/ | Audio en: /audio/');
        })();
    </script>
</body>
</html>
